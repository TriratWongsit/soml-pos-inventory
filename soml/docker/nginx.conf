# หน้าเว็บของอำพร OMS ใน Docker — เสิร์ฟไฟล์ที่ build แล้ว และส่งต่อคำขอไประบบหลังบ้าน
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/events {            # ช่องทางสำรอง SSE ห้ามพักข้อมูลไว้ ไม่งั้นคิวไม่ขึ้นทันที
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /ws {                    # WebSocket ของหน้าคิว
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
  location / {
    try_files $uri /index.html;     # React Router: ทุกเส้นทางของหน้าจอใช้ index.html
  }
}

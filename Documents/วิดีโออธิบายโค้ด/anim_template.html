<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0a1a}
body{font-family:'Noto Sans Thai',sans-serif;color:#f3f0ff}
#bg{position:absolute;inset:0;background:#120e22}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.35}
#g1{background:#6D3FC6}#g2{background:#1e40af}#g3{background:#9d174d;opacity:.18}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(196,181,253,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(196,181,253,.05) 1px,transparent 1px);background-size:60px 60px}
#pb{position:absolute;left:50px;right:50px;top:40px;height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;z-index:5}
#pb i{display:block;height:100%;background:linear-gradient(90deg,#FACC15,#FB923C);width:0}
.sc{position:absolute;inset:0;padding:78px 50px 0;display:none;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.chip{background:#6D3FC6;color:#fff;font-size:30px;font-weight:700;padding:10px 28px;border-radius:40px;box-shadow:0 6px 24px rgba(109,63,198,.5)}
.brand{font-size:27px;color:#c4b5fd;font-weight:600}
h1{font-size:60px;line-height:1.22;font-weight:800;margin:30px 0 24px;color:#fff;transform-origin:left center}
.vis{position:relative;height:1080px;display:flex;flex-direction:column;justify-content:center}
.subs{position:absolute;left:50px;right:50px;bottom:60px;height:330px}
.st{position:absolute;left:0;right:0;bottom:0;background:rgba(15,10,35,.82);border:2px solid rgba(250,204,21,.55);border-radius:24px;
 padding:26px 30px 26px 190px;font-size:38px;line-height:1.48;font-weight:600;opacity:0;min-height:200px;display:flex;align-items:center;
 backdrop-filter:blur(6px)}
#mascot{position:absolute;left:72px;bottom:96px;width:130px;height:150px;z-index:20}
/* code */
.code{background:rgba(8,6,20,.92);border:2px solid #3b2f63;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.fn{color:#c4b5fd;font-size:25px;padding:16px 26px;border-bottom:1px solid #2b2347;font-weight:700;background:rgba(109,63,198,.15)}
.fn em{font-style:normal;color:#8b80b0;font-weight:500;margin-left:10px}
.vp{height:880px;overflow:hidden;position:relative}
.inner{position:absolute;left:0;right:0;top:0;padding:14px 0}
.ln{display:flex;padding:3px 20px 3px 0;font:26px/1.55 'Menlo','Noto Sans Thai',monospace;position:relative}
.ln .no,.ln .tx{position:relative;z-index:1}
.ln .no{flex:0 0 82px;text-align:right;padding-right:20px;color:#5f5685}
.ln .tx{white-space:pre-wrap;word-break:break-all;flex:1;color:#e8e3ff}
.ln .hlbg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,204,21,.32),rgba(250,204,21,.10));border-left:10px solid #FACC15;opacity:0}
/* flow */
.flow{position:relative;display:flex;flex-direction:column;align-items:stretch}
.fb{--c:#60A5FA;border:3px solid var(--c);border-radius:20px;padding:12px 26px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:4px;opacity:0;position:relative;z-index:1}
.fb b{font-size:35px;color:var(--c)}.fb span{font-size:28px;color:#ddd6fe;line-height:1.35}
.arr{text-align:center;color:#a78bfa;font-size:30px;line-height:1.25;opacity:0}
.pkt{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0,#FACC15 45%,rgba(250,204,21,0) 72%);left:0;top:0;opacity:0;z-index:3;
 box-shadow:0 0 40px 14px rgba(250,204,21,.55)}
/* shot */
.shot{display:flex;flex-direction:column;align-items:center;gap:26px}
.frame{width:980px;height:900px;border-radius:24px;overflow:hidden;border:3px solid #3b2f63;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.frame img{max-width:100%;max-height:100%;transform-origin:50% 40%}
.sl{font:29px/1.4 'Menlo','Noto Sans Thai',monospace;color:#FACC15;text-align:center;opacity:0}
/* big */
.big{text-align:center}.bt{font-size:84px;font-weight:800;line-height:1.28;color:#FACC15;text-shadow:0 10px 40px rgba(250,204,21,.35)}
.bs{font-size:40px;color:#ddd6fe;margin-top:36px}
/* qa */
.qa{display:flex;flex-direction:column;gap:22px}
.q{align-self:flex-start;background:#F87171;color:#fff;font-weight:800;font-size:31px;padding:9px 26px;border-radius:30px}
.q.a{background:#34D399;color:#05371f}
.qq{font-size:56px;font-weight:800;line-height:1.35}
.think{display:flex;align-items:center;gap:26px;font-size:40px;color:#FACC15;font-weight:700;opacity:0}
.ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff}
.ans{opacity:0;display:flex;flex-direction:column;gap:18px}
.aa{font-size:40px;line-height:1.5;background:rgba(52,211,153,.1);border:3px solid #34D399;border-radius:22px;padding:26px}
/* race */
.race{position:relative;height:1040px}
.dev{position:absolute;top:20px;width:420px;height:230px;border:3px solid #60A5FA;border-radius:24px;background:rgba(96,165,250,.08);padding:22px 28px}
.dev.a{left:0}.dev.b{right:0;border-color:#FB923C;background:rgba(251,146,60,.08)}
.dn{font-size:44px;font-weight:800}.dd{font-size:28px;color:#ddd6fe}
.res{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:31px;font-weight:800;opacity:0}
.gate{position:absolute;left:290px;width:400px;top:560px;text-align:center;font-size:32px;font-weight:700;color:#FACC15;border:2px dashed #FACC15;border-radius:16px;padding:12px;opacity:0}
.db{position:absolute;left:240px;width:500px;top:720px;height:260px;border:3px solid #34D399;border-radius:24px;background:rgba(52,211,153,.08);text-align:center;padding-top:40px}
.dbt{font-size:48px;font-weight:800;color:#34D399}.dbs{font-size:31px;margin-top:10px}
.stock{position:absolute;left:0;right:0;top:1010px;text-align:center;font-size:38px;font-weight:700}
.stock b{color:#FACC15;font-size:52px}
.pk{position:absolute;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#120e22;left:0;top:0}
.pa{background:#60A5FA;box-shadow:0 0 34px rgba(96,165,250,.8)}.pb{background:#FB923C;box-shadow:0 0 34px rgba(251,146,60,.8)}
.rl{position:absolute;left:0;right:0;top:1110px;text-align:center;font:34px 'Menlo','Noto Sans Thai',monospace;color:#fff;opacity:0}
</style></head>
<body>
<div id="bg"><div class="blob" id="g1"></div><div class="blob" id="g2"></div><div class="blob" id="g3"></div><div id="grid"></div></div>
<div id="pb"><i id="pbi"></i></div>
/*SCENES*/
<svg id="mascot" viewBox="0 0 130 150">
 <ellipse cx="65" cy="142" rx="44" ry="7" fill="rgba(0,0,0,.35)"/>
 <g id="mbody">
  <rect x="18" y="20" width="94" height="104" rx="44" fill="#6D3FC6" stroke="#c4b5fd" stroke-width="4"/>
  <rect x="30" y="38" width="70" height="46" rx="20" fill="#1b1433"/>
  <g id="eyes"><ellipse id="e1" cx="50" cy="60" rx="7" ry="9" fill="#FACC15"/><ellipse id="e2" cx="80" cy="60" rx="7" ry="9" fill="#FACC15"/></g>
  <ellipse id="mouth" cx="65" cy="102" rx="14" ry="3" fill="#1b1433"/>
  <line x1="65" y1="20" x2="65" y2="6" stroke="#c4b5fd" stroke-width="4"/><circle id="ant" cx="65" cy="6" r="6" fill="#FACC15"/>
 </g>
</svg>
<script>
const D = /*DATA*/;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const S = D.scenes;

// ---------- ค่าที่วัดครั้งเดียวตอนเริ่ม ----------
function measure() {
  S.forEach((sc, i) => {
    const el = $('s' + i); el.style.display = 'flex'; el.style.visibility = 'hidden';
    if (sc.kind === 'code') {
      const vp = $('vp' + i), inner = $('in' + i);
      sc.lineTop = []; sc.lineH = [];
      inner.querySelectorAll('.ln').forEach((ln) => { sc.lineTop.push(ln.offsetTop); sc.lineH.push(ln.offsetHeight); ln.insertAdjacentHTML('afterbegin', '<div class="hlbg"></div>'); });
      const maxOff = Math.max(0, inner.offsetHeight - vp.clientHeight);
      sc.beats.forEach((b) => {
        if (!b.lines || !b.lines.length) { b.off = null; return; }
        const top = sc.lineTop[b.lines[0]], bot = sc.lineTop[b.lines[b.lines.length - 1]] + sc.lineH[b.lines[b.lines.length - 1]];
        b.off = clamp((top + bot) / 2 - vp.clientHeight / 2, 0, maxOff);
      });
      let last = 0; sc.beats.forEach((b) => { if (b.off === null) b.off = last; last = b.off; });
    }
    if (sc.kind === 'flow') {
      const fl = $('flow' + i); sc.center = [];
      const room = fl.parentElement.clientHeight - 20;
      const z = fl.scrollHeight > room ? room / fl.scrollHeight : 1;
      if (z < 1) fl.style.zoom = z.toFixed(3);
      const fr = fl.getBoundingClientRect();
      fl.querySelectorAll('.fb').forEach((b) => { const r = b.getBoundingClientRect();
        sc.center.push([(r.right - fr.left) / z - 70, (r.top + r.height / 2 - fr.top) / z]); });
      sc.reveal = []; let shown = 0;
      sc.beats.forEach((b) => { const n = b.show || shown; for (let k = shown; k < n; k++) sc.reveal[k] = b.start; shown = Math.max(shown, n); });
    }
    if (sc.kind === 'race') {
      const r = $('race' + i), c = (el) => [el.offsetLeft + el.offsetWidth / 2 - 48, el.offsetTop + el.offsetHeight / 2 - 48];
      const da = $('da' + i), dbv = $('db' + i), gt = $('gt' + i), dx = $('dbx' + i);
      // จุดพักของแต่ละตัว วางไว้ในที่ว่าง ไม่ทับข้อความ
      sc.pos = { A: [da.offsetLeft + da.offsetWidth - 120, da.offsetTop + 24], B: [dbv.offsetLeft + dbv.offsetWidth - 120, dbv.offsetTop + 24],
                 gate: [gt.offsetLeft + gt.offsetWidth / 2 - 48, gt.offsetTop - 118], db: [dx.offsetLeft + dx.offsetWidth / 2 - 48, dx.offsetTop - 48] };
    }
    el.style.display = 'none'; el.style.visibility = 'visible';
  });
}

function beatAt(sc, local) { let j = -1; sc.beats.forEach((b, k) => { if (local >= b.start) j = k; }); return j; }

function drawCode(i, sc, local, j) {
  const cur = j >= 0 ? sc.beats[j] : null, prev = j > 0 ? sc.beats[j - 1] : null;
  const u = cur ? ease((local - cur.start) / .45) : 0;
  const curSet = new Set(cur ? cur.lines : []), prevSet = new Set(prev ? prev.lines : []);
  const any = cur && cur.lines.length;
  sc.lineTop.forEach((_, k) => {
    const ln = $('ln' + i + '_' + k);
    const appear = clamp((local - .25 - k * .025) / .35);
    const a = prevSet.has(k) ? 1 : 0, b = curSet.has(k) ? 1 : 0, h = lerp(a, b, u);
    ln.firstChild.style.opacity = h;
    ln.style.opacity = appear * (any ? lerp(.42, 1, h) : .9);
    ln.style.transform = `translateX(${(1 - ease(appear)) * 40}px)`;
  });
  const o0 = sc.beats[0].off, oPrev = prev ? prev.off : o0, oCur = cur ? cur.off : o0;
  const v = cur ? ease((local - cur.start) / .8) : 1;
  $('in' + i).style.transform = `translateY(${-lerp(oPrev, oCur, v)}px)`;
}

function drawFlow(i, sc, local, j) {
  const cur = j >= 0 ? sc.beats[j] : null, hl = new Set(cur && cur.hl ? cur.hl : []);
  sc.center.forEach((_, k) => {
    const fb = $('fb' + i + '_' + k), r = sc.reveal[k];
    const a = r === undefined ? 0 : ease((local - r) / .5);
    fb.style.opacity = a; fb.style.transform = `translateY(${(1 - a) * 40}px) scale(${lerp(.94, 1, back((local - (r || 0)) / .5))})`;
    const g = hl.has(k) ? ease((local - cur.start) / .4) : 0;
    fb.style.boxShadow = `0 0 ${46 * g}px ${10 * g}px color-mix(in srgb, var(--c) ${Math.round(60 * g)}%, transparent)`;
    fb.style.background = `color-mix(in srgb, var(--c) ${Math.round(4 + 14 * g)}%, transparent)`;
    if (k) { const ar = $('ar' + i + '_' + k); ar.style.opacity = a; }
  });
  const pk = $('pk' + i);
  if (cur && cur.packet) {
    const [fa, fb] = cur.packet, d = Math.min(1.3, cur.dur * .6), x = (local - cur.start) / d;
    const p = ease(x), A = sc.center[fa], B = sc.center[fb];
    pk.style.left = lerp(A[0], B[0], p) + 'px'; pk.style.top = (lerp(A[1], B[1], p) - 23) + 'px';
    pk.style.opacity = x < 0 ? 0 : x < 1 ? 1 : clamp(1 - (x - 1) * 2.5);
    pk.style.transform = `scale(${1 + .25 * Math.sin(local * 9)})`;
  } else pk.style.opacity = 0;
}

function drawRace(i, sc, local, j) {
  const P = sc.pos, ph = j >= 0 ? sc.beats[j].phase : 0, u = j >= 0 ? local - sc.beats[j].start : 0;
  const pa = $('pa' + i), pb = $('pb' + i);
  const put = (el, p, s = 1) => { el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px'; el.style.transform = `scale(${s})`; };
  const mix = (a, b, x) => [lerp(a[0], b[0], x), lerp(a[1], b[1], x)];
  const gateA = [P.gate[0] - 120, P.gate[1]], gateB = [P.gate[0] + 120, P.gate[1]];
  let a = P.A, b = P.B;
  if (ph >= 1) { const x = ph === 1 ? ease(u / 1.4) : 1; a = mix(P.A, gateA, x); b = mix(P.B, gateB, x); }
  if (ph >= 2) { const x = ph === 2 ? ease(u / 1.1) : 1; a = mix(gateA, P.db, x); }
  if (ph >= 3) { const x = ph === 3 ? ease(u / 1.1) : 1; a = ph === 3 ? mix(P.db, P.A, ease(u / 1.4)) : P.A; b = mix(gateB, P.db, x); }
  if (ph >= 4) { a = P.A; b = mix(P.db, P.B, ease(u / 1.4)); }
  const wobble = ph === 2 ? Math.sin(local * 12) * 6 : 0;
  put(pa, a, ph >= 1 ? 1 : ease(local / .6)); put(pb, [b[0] + wobble, b[1]], ph >= 1 ? 1 : ease(local / .6));
  $('gt' + i).style.opacity = ph >= 1 ? ease((ph === 1 ? u - .8 : 9) / .4) : 0;
  const dbx = $('dbx' + i);
  const flashG = ph === 2 ? clamp(1 - Math.abs(u - 1.3) / .8) : 0, flashR = ph === 3 ? clamp(1 - Math.abs(u - 1.3) / .8) : 0;
  dbx.style.boxShadow = flashG ? `0 0 ${80 * flashG}px rgba(52,211,153,${flashG})` : flashR ? `0 0 ${80 * flashR}px rgba(248,113,113,${flashR})` : 'none';
  dbx.style.borderColor = ph === 3 && u > 1 ? '#F87171' : '#34D399';
  $('st' + i).textContent = ph >= 2 && (ph > 2 || u > 1.2) ? 'ส่งมอบสำเร็จ (delivered)' : 'รอจ่าย';
  const sv = ph >= 2 && (ph > 2 || u > 1.4) ? 8 : 10; $('sv' + i).textContent = sv;
  $('sk' + i).style.transform = `scale(${ph === 2 ? 1 + .12 * clamp(1 - Math.abs(u - 1.5) / .5) : 1})`;
  const ra = $('ra' + i), rb = $('rb' + i);
  ra.style.opacity = ph >= 2 ? ease((ph === 2 ? u - 1.4 : 9) / .4) : 0; ra.textContent = '✓ affectedRows = 1'; ra.style.color = '#34D399';
  rb.style.opacity = ph >= 4 ? ease((u - 1.2) / .4) : 0; rb.textContent = '✗ 409 ALREADY_DISPATCHED'; rb.style.color = '#F87171'; rb.style.fontSize = '28px';
  const rl = $('rl' + i);
  const msg = ph === 2 ? 'A ผ่าน → ตัดสต็อก → commit' : ph === 3 ? 'B: เงื่อนไขสถานะไม่ตรงแล้ว → affectedRows = 0' : ph === 4 ? 'สต็อกถูกหักครั้งเดียว ✓ (TC-06)' : '';
  rl.textContent = msg; rl.style.opacity = msg ? ease((u - .3) / .4) : 0; rl.style.color = ph === 3 ? '#F87171' : ph === 4 ? '#FACC15' : '#34D399';
}

function drawQA(i, sc, local, j) {
  const q = sc.beats[0], ans = sc.beats[1];
  const t0 = q.start + q.dur + .3, t1 = ans.start;
  const th = $('th' + i), rg = $('rg' + i);
  const inThink = local >= t0 && local < t1;
  th.style.opacity = inThink ? ease((local - t0) / .3) : local >= t1 ? clamp(1 - (local - t1) / .3) : 0;
  const rem = Math.max(0, t1 - local), frac = clamp(1 - rem / (t1 - t0));
  rg.textContent = Math.ceil(rem) || '';
  rg.style.background = `conic-gradient(#FACC15 ${frac * 360}deg, rgba(255,255,255,.12) 0deg)`;
  const an = $('an' + i), a = ease((local - ans.start) / .5);
  an.style.opacity = a; an.style.transform = `translateY(${(1 - a) * 40}px)`;
}

function drawScene(i, local, enter) {
  const sc = S[i], el = $('s' + i), j = beatAt(sc, local);
  el.style.display = 'flex';
  el.style.opacity = enter; el.style.transform = `translateY(${(1 - enter) * 70}px)`;
  const h = $('h' + i), hv = ease((local - .1) / .5);
  h.style.opacity = hv; h.style.transform = `translateX(${(1 - hv) * -40}px)`;
  sc.beats.forEach((b, k) => {
    const s = $('su' + i + '_' + k);
    const on = k === j ? ease((local - b.start + .15) / .3) : 0;
    s.style.opacity = on; s.style.transform = `translateY(${(1 - on) * 20}px)`;
  });
  if (sc.kind === 'code') drawCode(i, sc, local, j);
  else if (sc.kind === 'flow') drawFlow(i, sc, local, j);
  else if (sc.kind === 'race') drawRace(i, sc, local, j);
  else if (sc.kind === 'qa') drawQA(i, sc, local, j);
  else if (sc.kind === 'shot') {
    const im = $('im' + i), d = sc.end - sc.start, p = clamp(local / d);
    im.style.transform = `scale(${1.02 + .1 * p})`; im.style.opacity = ease(local / .6);
    el.querySelector('.sl').style.opacity = ease((local - .5) / .5);
  } else if (sc.kind === 'big') {
    const bt = el.querySelector('.bt'), bs = el.querySelector('.bs');
    bt.style.transform = `scale(${lerp(.7, 1, back((local - .2) / .7))})`; bt.style.opacity = ease((local - .2) / .5);
    bs.style.opacity = ease((local - 1) / .6);
  }
  return j;
}

let shown = new Set();
window.render = function (t) {
  let i = S.findIndex((s) => t >= s.start && t < s.end); if (i < 0) i = S.length - 1;
  const sc = S[i], local = t - sc.start;
  const enter = i === 0 ? ease(local / .6) : ease(local / .55);
  const now = new Set([i]);
  if (i > 0 && local < .55) {
    const p = $('s' + (i - 1)); p.style.display = 'flex'; p.style.opacity = 1 - enter; p.style.transform = `translateY(${-enter * 70}px)`; now.add(i - 1);
  }
  shown.forEach((k) => { if (!now.has(k)) $('s' + k).style.display = 'none'; });
  shown = now;
  const j = drawScene(i, local, enter);
  // พื้นหลังเคลื่อนช้าๆ
  $('g1').style.transform = `translate(${-200 + 180 * Math.sin(t / 7)}px, ${-150 + 120 * Math.cos(t / 9)}px)`;
  $('g2').style.transform = `translate(${400 + 160 * Math.cos(t / 8)}px, ${1100 + 140 * Math.sin(t / 6)}px)`;
  $('g3').style.transform = `translate(${300 + 200 * Math.sin(t / 11)}px, ${600 + 200 * Math.cos(t / 10)}px)`;
  $('grid').style.backgroundPosition = `0 ${(t * 12) % 60}px`;
  $('pbi').style.width = (100 * t / D.total) + '%';
  // ผู้บรรยาย: ขยับปากเมื่อกำลังพูด กะพริบตา และลอยขึ้นลงเบาๆ
  let talk = 0; sc.beats.forEach((b) => { if (local >= b.start && local < b.start + b.dur) talk = 1; });
  const m = talk ? .25 + .75 * Math.abs(Math.sin(local * 13) * Math.sin(local * 5.3 + 1)) : 0;
  $('mouth').setAttribute('ry', (3 + 13 * m).toFixed(1));
  const blink = (t % 4.2) < .14 ? .15 : 1;
  $('e1').setAttribute('ry', 9 * blink); $('e2').setAttribute('ry', 9 * blink);
  $('mbody').setAttribute('transform', `translate(0 ${(Math.sin(t * 2.2) * 4 - talk * 2).toFixed(2)})`);
  $('ant').setAttribute('fill', talk && Math.sin(local * 10) > 0 ? '#FB923C' : '#FACC15');
};
document.fonts.ready.then(() => { measure(); window.ready = true; render(0); });
</script>
</body></html>

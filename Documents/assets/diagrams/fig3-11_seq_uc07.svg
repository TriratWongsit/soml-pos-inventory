xt><circle cx="460" cy="904" r="12" fill="#0F4C81"/><text x="460.0" y="910.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">15</text><line x1="460" y1="948" x2="312" y2="948" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#op)"/><text x="330.0" y="938.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">ส่งมอบสำเร็จ</text><circle cx="460" cy="948" r="12" fill="#0F4C81"/><text x="460.0" y="954.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">16</text><line x1="310" y1="992" x2="187" y2="992" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="205.0" y="982.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">ลบคำสั่งซื้อออกจากคิว</text><circle cx="310" cy="992" r="12" fill="#0F4C81"/><text x="310.0" y="998.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">17</text><line x1="310" y1="1036" x2="598" y2="1036" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="340.0" y="1026.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">ตรวจ stock_qty เทียบ reorder_point</text><circle cx="310" cy="1036" r="12" fill="#0F4C81"/><text x="310.0" y="1042.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">18</text><line x1="600" y1="1080" x2="918" y2="1080" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="630.0" y="1070.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">INSERT notifications (low_stock)</text><circle cx="600" cy="1080" r="12" fill="#0F4C81"/><text x="600.0" y="1086.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">19</text><line x1="600" y1="1124" x2="738" y2="1124" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="630.0" y="1114.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">แจ้งเตือนในแอป</text><circle cx="600" cy="1124" r="12" fill="#0F4C81"/><text x="600.0" y="1130.0" font-size="14" font-w
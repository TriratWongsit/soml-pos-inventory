="#111827" text-anchor="middle">MySQL</text><text x="920.0" y="84.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">(InnoDB)</text><line x1="62" y1="158" x2="183" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="92.0" y="148.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">เลือกคำสั่งซื้อจากคิว</text><circle cx="62" cy="158" r="12" fill="#0F4C81"/><text x="62.0" y="164.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="185" y1="202" x2="308" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="215.0" y="192.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">GET /api/orders/:id</text><circle cx="185" cy="202" r="12" fill="#0F4C81"/><text x="185.0" y="208.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="310" y1="246" x2="918" y2="246" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="340.0" y="236.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">SELECT orders + order_items</text><circle cx="310" cy="246" r="12" fill="#0F4C81"/><text x="310.0" y="252.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="920" y1="290" x2="312" y2="290" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#op)"/><text x="330.0" y="280.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">รายการสินค้าของคำสั่งซื้อ</text><circle cx="920" cy="290" r="12" fill="#0F4C81"/><text x="920.0" y="296.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="310" y1="334" x2="187" y2="334" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#op)"/><text x="205.0" y="324.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">แสดงรายการให้ตรวจสอบ</text><circle cx="310" cy="334" r="12" fill="#0F4C81"/><text x="310.0" y="340.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><line x1="62" y1="378" x2="183" y2="378" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="92.0" y="368.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">ตรวจสินค้าแล้วกดยืนยันจ่าย</text><circle cx="62" cy="378" r="12" fill="#0F4C81"/><text x="62.0" y="384.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><line x1="185" y1="422" x2="308" y2="422" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="215.0" y="412.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">POST /api/orders/:id/dispatch</text><circle cx="185" cy="422" r="12" fill="#0F4C81"/><text x="185.0" y="428.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text><line x1="310" y1="466" x2="458" y2="466" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="340.0" y="456.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">เรียกธุรกรรมตัดสต็อก</text><circle cx="310" cy="466" r="12" fill="#0F4C81"/><text x="310.0" y="472.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">8</text><line x1="460" y1="510" x2="918" y2="510" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="490.0" y="500.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">START TRANSACTION</text><circle cx="460" cy="510" r="12" fill="#0F4C81"/><text x="460.0" y="516.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9</text><line x1="460" y1="580" x2="918" y2="580" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><text x="490.0" y="544.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">UPDATE orders SET status='delivered' WHERE order_id=?</text><text x="490.0" y="570.0" font-size="19" font-weight="400" fill="#111827" text-anchor="start">AND status IN ('awaiting_dispatch','picking')</text><circle cx="460" cy="580" r="12" fill="#0F4C81"/><text x="460.0" 
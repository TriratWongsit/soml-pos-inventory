xt x="205.0" y="1092.0" font-size="17" font-weight="400" fill="#111827" text-anchor="middle">notifications · audit_logs</text><rect x="450" y="950" width="300" height="150" rx="10" fill="#DBE6F7" stroke="#0F4C81" stroke-width="2.2"/><text x="600.0" y="1003.0" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Receipt Print Service</text><text x="600.0" y="1029.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">[Container: Node.js]</text><text x="600.0" y="1057.0" font-size="17" font-weight="400" fill="#111827" text-anchor="middle">รับคำสั่งพิมพ์จาก Backend</text><rect x="450" y="1200" width="300" height="120" rx="10" fill="#F7E9D8" stroke="#9A5A12" stroke-width="2.2"/><text x="600.0" y="1238.0" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">เครื่องพิมพ์ใบเสร็จ</text><text x="600.0" y="1264.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">[External Hardware]</text><text x="600.0" y="1292.0" font-size="17" font-weight="400" fill="#111827" text-anchor="middle">ความร้อน 80 มม.</text><line x1="130" y1="106" x2="210" y2="248" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><line x1="410" y1="106" x2="410" y2="248" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><line x1="690" y1="106" x2="590" y2="248" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><text x="700.0" y="170.0" font-size="17" font-weight="600" fill="#111827" text-anchor="start">ใช้งานผ่านเบราว์เซอร์ (HTTP)</text><line x1="330" y1="420" x2="330" y2="558" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><text x="318.0" y="470.0" font-size="17" font-weight="600" fill="#111827" text-anchor="end">REST API</text><text x="318.0" y="492.0" font-size="17" font-weight="400" fill="#111827" text-anchor="end">(JSON/HTTP)</text><line x1="470" y1="560" x2="470" y2="422" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><text x="482.0" y="470.0" font-size="17" font-weight="600" fill="#11182
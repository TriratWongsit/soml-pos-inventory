text x="750.0" y="758.0" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">เครื่องพิมพ์ใบเสร็จความร้อน</text><text x="750.0" y="784.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">[External Hardware]</text><text x="750.0" y="812.0" font-size="17" font-weight="400" fill="#111827" text-anchor="middle">พิมพ์ใบเสร็จกระดาษ</text><line x1="330" y1="520" x2="250" y2="698" stroke="#374151" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ar)"/><text x="318.0" y="600.0" font-size="17" font-weight="600" fill="#111827" text-anchor="start">แสดงรหัส QR ให้สแกน</text><text x="318.0" y="622.0" font-size="17" font-weight="400" fill="#111827" text-anchor="start">ไม่มีข้อมูลส่งกลับ</text><line x1="670" y1="520" x2="750" y2="698" stroke="#374151" stroke-width="2.2" marker-end="url(#ar)"/><text x="724.0" y="600.0" font-size="17" font-weight="600" fill="#111827" text-anchor="start">ส่งคำสั่งพิมพ์</text><text x="724.0" y="622.0" font-size="17" font-weight="400" fill="#111827" text-anchor="start">ESC/POS</text></svg>
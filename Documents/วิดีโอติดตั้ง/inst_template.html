<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d0a1a}
body{font-family:'Noto Sans Thai',sans-serif;color:#f3f0ff}
#bg{position:absolute;inset:0;background:#120e22;overflow:hidden}
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(140px);opacity:.33}
#g1{background:#6D3FC6}#g2{background:#0e7490}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(196,181,253,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(196,181,253,.05) 1px,transparent 1px);background-size:64px 64px}
#pb{position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.08);z-index:30}
#pb i{display:block;height:100%;background:linear-gradient(90deg,#34D399,#60A5FA);width:0}
.sc{position:absolute;inset:0;display:none}
.vis{position:absolute;left:0;right:0;top:0;bottom:200px}
.tag{position:absolute;left:40px;top:26px;background:#6D3FC6;color:#fff;font-size:28px;font-weight:700;padding:8px 26px;border-radius:30px;z-index:12;box-shadow:0 6px 24px rgba(109,63,198,.5)}
.subs{position:absolute;left:40px;right:40px;bottom:30px;height:170px;z-index:15}
.st{position:absolute;left:0;right:0;bottom:0;min-height:130px;background:rgba(12,8,30,.88);border:2px solid rgba(52,211,153,.55);border-radius:22px;
 padding:20px 34px 20px 170px;font-size:36px;line-height:1.45;font-weight:600;opacity:0;display:flex;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#mascot{position:absolute;left:62px;bottom:46px;width:110px;height:128px;z-index:20}
/* title */
.ttl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 140px}
.tk{font-size:34px;color:#34D399;font-weight:800;letter-spacing:4px;background:rgba(52,211,153,.12);border:2px solid #34D399;padding:8px 30px;border-radius:30px}
.tt{font-size:92px;line-height:1.25;font-weight:800;color:#fff;margin-top:30px;text-shadow:0 10px 50px rgba(96,165,250,.35)}
.ts{font-size:36px;color:#ddd6fe;margin-top:30px;line-height:1.5}
/* checklist */
.cl{position:absolute;inset:0;padding:84px 120px 0}
.ch{font-size:52px;font-weight:800;margin-bottom:18px}
.cis{display:flex;flex-direction:column;gap:12px}
.ci{display:flex;align-items:center;gap:30px;padding:10px 30px;border:2px solid rgba(196,181,253,.25);border-radius:22px;background:rgba(255,255,255,.04);opacity:0}
.ci b{font-size:37px;display:block}.ci small{font-size:27px;color:#c4b5fd}
.cb{flex:0 0 58px;height:58px;border-radius:50%;border:4px solid #6b6290;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#06281b}
/* stages */
.stg{position:absolute;inset:0;padding:100px 120px 0}
.mock{position:absolute;right:40px;top:30px;font-size:22px;color:#c4b5fd;border:1px dashed #8b80b0;border-radius:14px;padding:4px 14px}
.pn{position:absolute;left:120px;right:120px;top:100px;bottom:20px;opacity:0;display:flex;align-items:center;justify-content:center}
.win{width:1460px;background:#f3f4f6;color:#111;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative}
.tb{background:#e5e7eb;font-size:24px;padding:12px 20px;display:flex;align-items:center;gap:16px;color:#374151;font-weight:600}
.dots{display:flex;gap:8px}.dots i{width:16px;height:16px;border-radius:50%;background:#d1d5db;display:block}
.wb{padding:22px 26px;min-height:470px;position:relative}
.addr{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:10px 18px;font:26px 'Menlo','Noto Sans Thai',monospace;margin-bottom:22px}
.files{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.fi{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px;border-radius:12px;font-size:24px}
.fi.sel{background:#dbeafe;outline:2px solid #60a5fa}
.ic{width:76px;height:64px;border-radius:8px;background:#fbbf24;position:relative}
.ic.dir:before{content:'';position:absolute;left:0;top:-10px;width:34px;height:14px;background:#f59e0b;border-radius:6px 6px 0 0}
.ic.zip{background:repeating-linear-gradient(90deg,#a78bfa 0 12px,#8b5cf6 12px 24px)}
.ic.bat{background:#1f2937;width:64px}.ic.bat:after{content:'>_';position:absolute;inset:0;color:#34D399;font:700 26px Menlo;display:flex;align-items:center;justify-content:center}
.ic.js{background:#fde047;width:64px}.ic.js:after{content:'JS';position:absolute;inset:0;color:#111;font:800 24px Menlo;display:flex;align-items:center;justify-content:center}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);width:760px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:28px 32px;font-size:28px;border:1px solid #d1d5db}
.dlg b{font-size:32px}.lbl{font-size:24px;color:#4b5563;margin:16px 0 8px}
.inp{border:2px solid #60a5fa;border-radius:8px;padding:10px 16px;font:28px 'Menlo','Noto Sans Thai',monospace;background:#fff;color:#111}
.btns{display:flex;justify-content:flex-end;gap:14px;margin-top:22px}
.btn{border:1px solid #9ca3af;border-radius:8px;padding:10px 26px;font-size:26px;background:#f9fafb;color:#111}.btn.pri{background:#2563eb;color:#fff;border-color:#2563eb}
.bar{height:22px;background:#e5e7eb;border-radius:11px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:0;background:#22c55e}
.smart{width:1180px;background:#1e3a8a;color:#fff;padding:60px 70px;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sh{font-size:56px;font-weight:700}.sd{font-size:30px;margin-top:20px;color:#dbeafe}.sl2{font-size:28px;margin-top:22px;text-decoration:underline}
.sbtn{display:flex;justify-content:flex-end;gap:16px;margin-top:50px}.smart .btn{background:#2563eb;color:#fff;border-color:#93c5fd}
.tabs{display:flex;gap:6px;border-bottom:2px solid #d1d5db;margin-bottom:26px}.tabs span{padding:10px 24px;font-size:26px}.tabs .on{border-bottom:4px solid #2563eb;font-weight:700}
.chk{font-size:30px;display:flex;align-items:center;gap:14px;margin-bottom:16px}.chk .box{width:36px;height:36px;border:2px solid #2563eb;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:6px}
.warnbox,.note2{width:1400px;border:3px solid #FACC15;border-radius:26px;background:rgba(250,204,21,.08);padding:50px 60px}
.wt{font-size:60px;font-weight:800;color:#FACC15}.wd{font-size:38px;margin-top:24px;line-height:1.5}.wf{font-size:36px;margin-top:30px;color:#34D399;font-weight:700}
.note2{border-color:#60A5FA;background:rgba(96,165,250,.08)}.nt{font-size:50px;font-weight:800;color:#93c5fd;margin-bottom:26px}
.nl{font-size:36px;line-height:1.5;margin-top:16px}
code{font-family:'Menlo',monospace;background:rgba(255,255,255,.12);padding:2px 10px;border-radius:8px;color:#FACC15}
.browser{width:1420px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.bbar{background:#e5e7eb;padding:12px 20px;display:flex;align-items:center;gap:18px}
.url{flex:1;background:#fff;border-radius:20px;padding:8px 22px;font:26px 'Menlo',monospace;color:#111}
.browser img{width:100%;max-height:640px;object-fit:cover;object-position:top;display:block}
.duo2{display:flex;align-items:center;gap:80px}
.phone{width:380px;height:770px;border-radius:52px;background:#111;padding:16px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.phone img{width:100%;height:calc(100% - 46px);object-fit:cover;object-position:top;border-radius:0 0 36px 36px;display:block;background:#fff}
.pnotch{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:2}
.purl{background:#f3f4f6;color:#111;font:19px Menlo;padding:22px 10px 4px;text-align:center;border-radius:36px 36px 0 0;height:46px}
.ptxt{display:flex;flex-direction:column;gap:26px;font-size:40px;font-weight:600}
.rcp{height:740px;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.cur{position:absolute;width:52px;height:52px;left:0;top:0;opacity:0;z-index:9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.rip{position:absolute;width:60px;height:60px;border-radius:50%;border:5px solid #FACC15;opacity:0;z-index:8}
.hlx{outline:5px solid #FACC15 !important;outline-offset:6px;border-radius:10px;box-shadow:0 0 30px rgba(250,204,21,.6)}
/* term */
.tw{position:absolute;left:120px;right:120px;top:100px;bottom:10px;background:#0c0c0c;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid #333}
.ttb{background:#1f1f1f;color:#ddd;font-size:24px;padding:10px 20px;display:flex;align-items:center;gap:14px}.tic{color:#60a5fa}.tx3{margin-left:auto;color:#888;letter-spacing:10px}
.tbody{position:absolute;left:0;right:0;top:50px;bottom:0;overflow:hidden;padding:20px 30px}
.tin{position:absolute;left:30px;right:30px;top:20px}
.tl{font:29px/1.55 'Menlo','Noto Sans Thai',monospace;color:#e5e5e5;white-space:pre-wrap;opacity:0}
.tl.t-ok{color:#4ade80}.tl.t-warn{color:#fbbf24}.p{color:#e5e5e5}.pc{color:#93c5fd}
.typed{color:#FACC15;font-weight:700}
.tg.backend{color:#60a5fa}.tg.print{color:#e879f9}.tg.frontend{color:#4ade80}
.caret{display:inline-block;width:16px;height:30px;background:#e5e5e5;vertical-align:middle;margin-left:4px}
</style></head>
<body>
<div id="bg"><div class="blob" id="g1"></div><div class="blob" id="g2"></div><div id="grid"></div></div>
<div id="pb"><i id="pbi"></i></div>
/*SCENES*/
<svg id="mascot" viewBox="0 0 130 150">
 <ellipse cx="65" cy="142" rx="44" ry="7" fill="rgba(0,0,0,.35)"/>
 <g id="mbody">
  <rect x="18" y="20" width="94" height="104" rx="44" fill="#6D3FC6" stroke="#c4b5fd" stroke-width="4"/>
  <rect x="30" y="38" width="70" height="46" rx="20" fill="#1b1433"/>
  <ellipse id="e1" cx="50" cy="60" rx="7" ry="9" fill="#34D399"/><ellipse id="e2" cx="80" cy="60" rx="7" ry="9" fill="#34D399"/>
  <ellipse id="mouth" cx="65" cy="102" rx="14" ry="3" fill="#1b1433"/>
  <line x1="65" y1="20" x2="65" y2="6" stroke="#c4b5fd" stroke-width="4"/><circle id="ant" cx="65" cy="6" r="6" fill="#34D399"/>
 </g>
</svg>
<script>
const D = /*DATA*/;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const S = D.scenes;

function measure() {
  S.forEach((sc, i) => {
    const el = $('s' + i); el.style.display = 'block'; el.style.visibility = 'hidden';
    if (sc.kind === 'stages') {
      const stg = el.querySelector('.stg'), so = stg.getBoundingClientRect();
      sc.pos = {};
      el.querySelectorAll('.pn').forEach((pn) => { pn.style.opacity = 1; });
      el.querySelectorAll('[id]').forEach((n) => { const r = n.getBoundingClientRect(); sc.pos[n.id] = [r.left - so.left + r.width / 2, r.top - so.top + r.height / 2]; });
      el.querySelectorAll('.pn').forEach((pn) => { pn.style.opacity = 0; });
      let cur = [1500, 760];
      sc.beats.forEach((b) => { b.from = cur; if (b.click && sc.pos[b.click]) cur = sc.pos[b.click]; b.to = cur; });
    }
    if (sc.kind === 'term') {
      sc.lines = [...el.querySelectorAll('.tl')].map((n) => ({ n, b: +n.dataset.b, top: n.offsetTop, h: n.offsetHeight, typed: n.querySelector('.typed') }));
      const rank = {}; sc.lines.forEach((l) => { rank[l.b] = (rank[l.b] || 0); l.r = rank[l.b]++; });
      let lastB = -1, acc = 0; sc.lines.forEach((l) => { if (l.b !== lastB) { lastB = l.b; acc = sc.beats[l.b].start + .2; } l.at = acc; l.text = l.typed ? l.typed.dataset.t : ''; acc += .6 + (l.typed ? .4 + Math.max(.6, [...l.text].length * .07) : 0); });
      sc.vh = el.querySelector('.tbody').clientHeight - 40;
    }
    el.style.display = 'none'; el.style.visibility = 'visible';
  });
}
const beatAt = (sc, local) => { let j = -1; sc.beats.forEach((b, k) => { if (local >= b.start) j = k; }); return j; };

function drawChecklist(i, sc, local, j) {
  const on = j >= 0 ? sc.beats[j].on : -1, n = sc.beats.length ? document.querySelectorAll(`#s${i} .ci`).length : 0;
  for (let k = 0; k < n; k++) {
    const ci = $('ci' + i + '_' + k), cb = $('cb' + i + '_' + k);
    const a = ease((local - .2 - k * .15) / .4);
    const done = k < on, act = k === on;
    const g = act ? ease((local - sc.beats[j].start) / .4) : 0;
    ci.style.opacity = a * (on >= 0 && k > on ? .55 : 1);
    ci.style.transform = `translateX(${(1 - a) * 60}px) scale(${1 + .03 * g})`;
    ci.style.borderColor = act ? `rgba(250,204,21,${.3 + .7 * g})` : done ? 'rgba(52,211,153,.55)' : 'rgba(196,181,253,.25)';
    ci.style.background = act ? `rgba(250,204,21,${.04 + .1 * g})` : 'rgba(255,255,255,.04)';
    cb.style.background = done ? '#34D399' : act ? 'rgba(250,204,21,.25)' : 'transparent';
    cb.style.borderColor = done ? '#34D399' : act ? '#FACC15' : '#6b6290';
    cb.textContent = done ? '✓' : String(k + 1); cb.style.color = done ? '#06281b' : act ? '#FACC15' : '#8b80b0';
  }
}

function drawStages(i, sc, local, j) {
  const cur = j >= 0 ? sc.beats[j] : null, prev = j > 0 ? sc.beats[j - 1] : null;
  const p = cur && cur.panel !== undefined ? cur.panel : 0, pp = prev && prev.panel !== undefined ? prev.panel : p;
  const f = cur ? ease((local - cur.start + .1) / .45) : 1;
  document.querySelectorAll(`#s${i} .pn`).forEach((pn, k) => {
    const o = k === p ? (pp === p ? 1 : f) : k === pp ? 1 - f : 0;
    pn.style.opacity = o; pn.style.transform = `scale(${k === p ? lerp(.97, 1, f) : 1})`;
  });
  const prog = document.querySelector(`#pn${i}_${p} .prog`);
  if (prog && cur) prog.style.width = (100 * clamp((local - cur.start) / Math.max(1, cur.dur))) + '%';
  document.querySelectorAll(`#s${i} .hlx`).forEach((n) => n.classList.remove('hlx'));
  if (cur && cur.hl) cur.hl.forEach((id) => { const n = $(id); if (n && local - cur.start > .3) n.classList.add('hlx'); });
  const cu = $('cu' + i), rp = $('rp' + i);
  if (cur && cur.click) {
    const u = ease((local - cur.start) / .9), x = lerp(cur.from[0], cur.to[0], u), y = lerp(cur.from[1], cur.to[1], u);
    cu.style.opacity = ease((local - cur.start) / .3); cu.style.left = (x - 6) + 'px'; cu.style.top = (y - 4) + 'px';
    const c = (local - cur.start - 1.0) / .5;
    rp.style.opacity = c > 0 && c < 1 ? 1 - c : 0; rp.style.left = (x - 30) + 'px'; rp.style.top = (y - 30) + 'px';
    rp.style.transform = `scale(${.4 + 1.4 * clamp(c)})`;
    cu.style.transform = `scale(${c > 0 && c < .3 ? .85 : 1})`;
    const n = $(cur.click); if (n && c > 0) n.classList.add('hlx');
  } else { cu.style.opacity = 0; rp.style.opacity = 0; }
}

function drawTerm(i, sc, local, j) {
  let bottom = 0, prevBottom = 0, lastShown = null;
  sc.lines.forEach((l) => {
    const a = clamp((local - l.at) / .15);
    l.n.style.opacity = a;
    if (a > 0) { prevBottom = bottom; bottom = l.top + l.h; lastShown = l; }
    if (l.typed) {
      const ch = Math.floor(clamp((local - l.at - .4) / Math.max(.6, l.text.length * .07)) * l.text.length);
      l.typed.textContent = [...l.text].slice(0, ch).join('');
    }
  });
  document.querySelectorAll(`#s${i} .caret`).forEach((c) => c.remove());
  if (lastShown && Math.floor(local * 2) % 2 === 0) lastShown.n.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
  const u = lastShown ? ease((local - lastShown.at) / .35) : 1;
  const off = Math.max(0, lerp(prevBottom, bottom, u) - sc.vh);
  $('ti' + i).style.transform = `translateY(${-off}px)`;
}

function drawScene(i, local, enter) {
  const sc = S[i], el = $('s' + i), j = beatAt(sc, local);
  el.style.display = 'block'; el.style.opacity = enter;
  el.querySelector('.vis').style.transform = `scale(${lerp(1.03, 1, enter)})`;
  sc.beats.forEach((b, k) => {
    const s = $('su' + i + '_' + k), on = k === j ? ease((local - b.start + .15) / .3) : 0;
    s.style.opacity = on; s.style.transform = `translateY(${(1 - on) * 18}px)`;
  });
  if (sc.kind === 'checklist') drawChecklist(i, sc, local, j);
  else if (sc.kind === 'stages') drawStages(i, sc, local, j);
  else if (sc.kind === 'term') drawTerm(i, sc, local, j);
  else if (sc.kind === 'title') {
    const tt = el.querySelector('.tt'), ts = el.querySelector('.ts'), tk = el.querySelector('.tk');
    tk.style.opacity = ease((local - .1) / .4);
    tt.style.opacity = ease((local - .3) / .5); tt.style.transform = `scale(${lerp(.85, 1, ease((local - .3) / .7))})`;
    ts.style.opacity = ease((local - .9) / .6);
  }
}

let shown = new Set();
window.render = function (t) {
  let i = S.findIndex((s) => t >= s.start && t < s.end); if (i < 0) i = S.length - 1;
  const sc = S[i], local = t - sc.start, TR = .6;
  const enter = i === 0 ? ease(local / .8) : ease(local / TR);
  const now = new Set([i]);
  if (i > 0 && local < TR) { const p = S[i - 1]; drawScene(i - 1, p.end - p.start - .001, 1); $('s' + (i - 1)).style.opacity = 1 - enter; now.add(i - 1); }
  shown.forEach((k) => { if (!now.has(k)) $('s' + k).style.display = 'none'; });
  shown = now;
  $('s' + i).style.zIndex = 2; if (i > 0) $('s' + (i - 1)).style.zIndex = 1;
  drawScene(i, local, enter);
  $('g1').style.transform = `translate(${-300 + 220 * Math.sin(t / 8)}px, ${-400 + 160 * Math.cos(t / 10)}px)`;
  $('g2').style.transform = `translate(${1100 + 200 * Math.cos(t / 9)}px, ${300 + 160 * Math.sin(t / 7)}px)`;
  $('grid').style.backgroundPosition = `${(t * 10) % 64}px 0`;
  $('pbi').style.width = (100 * t / D.total) + '%';
  let talk = 0; sc.beats.forEach((b) => { if (local >= b.start && local < b.start + b.dur) talk = 1; });
  const m = talk ? .25 + .75 * Math.abs(Math.sin(local * 13) * Math.sin(local * 5.3 + 1)) : 0;
  $('mouth').setAttribute('ry', (3 + 13 * m).toFixed(1));
  const blink = (t % 4.2) < .14 ? .15 : 1;
  $('e1').setAttribute('ry', 9 * blink); $('e2').setAttribute('ry', 9 * blink);
  $('mbody').setAttribute('transform', `translate(0 ${(Math.sin(t * 2.2) * 4 - talk * 2).toFixed(2)})`);
};
document.fonts.ready.then(() => { measure(); window.ready = true; render(0); });
</script>
</body></html>
